# Engine network contract: specs/engine.md#network-exposure.
global
    maxconn 1

defaults
    mode http
    timeout connect "${VIG_PROXY_CONNECT_TIMEOUT}"
    timeout client "${VIG_PROXY_IO_TIMEOUT}"
    timeout server "${VIG_PROXY_IO_TIMEOUT}"

frontend private_engine
    bind "${VIG_PROXY_LISTEN}" ssl crt "${VIG_PROXY_CERT}" ca-file "${VIG_GATEWAY_CA}" verify required alpn http/1.1
    acl gateway ssl_c_der,sha2(256),hex -m str -i "${VIG_GATEWAY_CERT_SHA256}"
    http-request deny deny_status 403 unless gateway

    acl health_method method GET
    acl health_url url -m str /health
    acl generate_method method POST
    acl generate_url url -m str /v1/completions
    http-request deny deny_status 404 unless health_method health_url or generate_method generate_url
    default_backend integer_engine

backend integer_engine
    server engine "127.0.0.1:${VIG_ENGINE_PORT-8000}" maxconn 1
