[Unit]
BindsTo=nftables.service
Requires=vig-engine-firewall.service
After=nftables.service vig-engine-firewall.service

[Service]
BindReadOnlyPaths=/models
IPAddressDeny=any
IPAddressAllow=localhost
ExecStart=
ExecStart=/usr/bin/env -i PATH=/opt/vig/engine/bin:/usr/bin:/bin HOME=/var/lib/vig-engine TMPDIR=/tmp CUDA_VISIBLE_DEVICES=0 VLLM_USE_V2_MODEL_RUNNER=1 VLLM_NO_USAGE_STATS=1 PYTHONSAFEPATH=1 GLOO_SOCKET_IFNAME=lo /usr/local/libexec/vig/engine --host 127.0.0.1 --port 8000
