groups:
  - name: akashi-private
    rules:
      - alert: EngineStartupGateFailure
        expr: akashi_engine_startup_gate_failed{service="engine"} > 0
        labels: {severity: critical, owner: engine}
        annotations: {summary: "Engine startup integrity gates failed"}
      - alert: UnwarrantedReplyRate
        expr: |
          sum by (job, instance, mode) (increase(akashi_unwarranted_total{service="engine"}[1h]))
          / on (job, instance, mode)
          sum by (job, instance, mode) (increase(akashi_engine_requests_total{service="engine"}[1h]))
          > 0.01
        labels: {severity: medium, owner: engine}
        annotations: {summary: "More than one percent of dispatched engine requests were unwarranted"}
      - alert: DeviationDetected
        expr: akashi_signed_deviations_last_5m{service="auditor"} > 0
        labels: {severity: critical, owner: auditor}
        annotations: {summary: "An authenticated deviation verdict was published in the last five minutes"}
      - alert: BeaconUnavailable
        expr: akashi_beacon_available{service="sampler"} == 0
        labels: {severity: high, owner: sampler}
        annotations: {summary: "The enabled sampler could not authenticate the beacon"}
      - alert: BeaconLagHigh
        expr: akashi_beacon_lag_seconds{service="sampler"} > 60
        labels: {severity: high, owner: sampler}
        annotations: {summary: "The authenticated beacon is more than one minute behind"}
      - alert: ObservationUnavailable
        expr: |
          (akashi_observation_coverage == 0)
          unless on (job, instance, mode, service) (akashi_sampling_coverage{state="disabled"} == 1)
        labels: {severity: high, owner: operations}
        annotations: {summary: "A configured role cannot provide a current observation"}
      - alert: PrivateScrapeUnavailable
        expr: |
          (up{job="akashi-private"} == 0)
          or ((up{job="akashi-private"} == 1) unless on (job, instance)
            (akashi_observation_coverage or akashi_log_checkpoint_known))
        labels: {severity: high, owner: operations}
        annotations: {summary: "A private monitoring target is down or exposes no role observations"}
      - alert: SignedHistoryIncident
        expr: |
          increase(akashi_log_incidents_total{service="log",kind=~"omitted_promise|conflicting_history|tree_size_regression|checkpoint_time_regression|promise_backdated|unverified_leaf_history|unverified_consistency"}[5m]) > 0
        labels: {severity: high, owner: log}
        annotations: {summary: "The independent monitor recorded a signed-history incident"}
