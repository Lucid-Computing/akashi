[project]
name = "verified-inference-gateway"
version = "0.0.0"
requires-python = ">=3.10"
dependencies = []

[tool.uv]
package = false
required-version = "==0.13.6"

[tool.mypy]
strict = true
exclude = ['^\.venv/']

[dependency-groups]
dev = [
    "mypy==2.4.1",
    "packaging==26.3",
    "ruff==0.17.6",
    "tomli==2.5.0 ; python_full_version < '3.11'",
]

[tool.ruff]
include = ["*.py", "*.pyi"]
