[project]
name = "verified-inference-gateway"
version = "0.0.0"
requires-python = ">=3.10"
dependencies = [
    "cryptography==50.0.2",
    "jinja2==3.1.6",
    "py-ecc==8.0.0",
    "pynacl==1.6.2",
    "rfc8785==0.1.4",
    "tokenizers==0.23.2",
]

[tool.uv]
package = false
required-version = "==0.13.6"

[tool.mypy]
strict = true
exclude = ['^\.venv/']

[dependency-groups]
dev = [
    "markdown-it-py==4.3.0",
    "mypy==2.4.1",
    "packaging==26.3",
    "ruff==0.17.6",
    "tomli==2.5.0 ; python_full_version < '3.11'",
]

[tool.ruff]
include = ["*.py", "*.pyi"]
